# =====================================================================
# 묶음(bundle) 정의 파일
#   묶음 1개 = 논문 1편 + 그 논문을 보도한 한국어 기사 3~5건
#   목표     = 묶음 20~25개 (기사 약 60~125건)
#   수집 방향 = 논문을 먼저 정하고 → 그 논문을 보도한 기사를 찾아 내려간다
#
# 아래 6개 묶음은 노션 '팀플 주제 구체화' + 사례 정리(사례 1~5)를 옮긴 것이다.
#  - 사례 2(타이레놀)는 논문이 2편이라 '묶음당 논문 1편' 원칙에 따라 B02/B03으로 나눴다.
#  - known_articles 는 스크린샷에 있던 기사 '제목 힌트'다. 제목이 잘린(…) 경우가 많고
#    URL이 비어 있다. 수집 후 article_candidates.csv 에서 실제 기사와 연결해야 한다.
#  - DOI 는 2026-10-01에 웹 검색으로 확인했다. B03(Wan 2026)은 DOI를 확인하지 못해
#    fetch-papers 단계에서 Crossref 제목 검색으로 찾는다(결과는 사람이 확인).
#
# 새 묶음 추가 방법: 맨 아래 TEMPLATE 블록을 복사해서 채운다.
#   `medclaim discover` 결과(annotation/bundle_candidates.csv)를 보고 고르면
#   '기사가 3건 이상 붙는 논문'을 찾기 쉽다.
# =====================================================================

bundles:

  - bundle_id: B01_PPI_dementia
    label: "PPI(위산분비억제제) ↔ 치매"
    drug_terms: [PPI, PPI제제, 양성자펌프억제제, 프로톤펌프억제제, 위산분비억제제, 위산억제제,
                 오메프라졸, 에스오메프라졸, 에소메프라졸, 란소프라졸, 판토프라졸, 라베프라졸, 넥시움]
    outcome_terms: [치매, 인지장애, 인지기능, 알츠하이머]
    paper:
      doi: "10.1212/WNL.0000000000207747"
      title: "Cumulative Use of Proton Pump Inhibitors and Risk of Dementia: The Atherosclerosis Risk in Communities Study"
      journal: Neurology
      first_author: Northuis
      published: "2023-08-09"
    search:
      queries: ["PPI 치매", "위산분비억제제 치매", "양성자펌프억제제 치매", "PPI 장기 복용 치매 위험", "역류성식도염 약 치매"]
      date_from: "2023-08-09"
      date_to: "2023-10-31"
    known_articles:   # 웹 검색(2026-10-02)으로 찾은 후보. 어느 논문 보도인지는 본문을 읽고 article_candidates.csv 에서 판정
      - outlet: 메디칼타임즈
        title_hint: PPI제제 장기 복용시 치매 위험…1.3배 발병률 상승
        url: "https://m.medicaltimes.com/News/NewsView.html?ID=1154917"
      - outlet: 메디코파마
        title_hint: PPI 장기사용, 치매 위험↑…국산 P-CAB 제제, 대체 가능할까?
        url: "https://www.medicopharma.co.kr/news/articleView.html?idxno=61123"
      - outlet: 더사이언스플러스
        title_hint: 위산분비억제제(PPI) 장기 복용하면 치매 위험 높아
        url: "https://thescienceplus.com/news/newsview.php?ncode=1065595137213180&dt=m"
      - outlet: US메트로뉴스
        title_hint: 위산 역류 치료제 장기 복용하면 치매 위험 커져
        url: "https://usmetronews.com/us/9048"
    notes: >
      논문: 현재 복용자 전체는 치매 위험 유의하지 않음(HR 1.1, 95% CI 0.9-1.3),
      누적 4.4년 초과 복용군에서만 상승(약 1.33배). 메디칼타임즈 기사는 제목에 수치를 단정적으로,
      본문에 '인과관계는 추가 연구 필요'·'PPI를 끊어야 한다는 의미는 아니다'를 실음 → 제목-본문 불일치,
      '4.4년 초과' 조건이 제목에서 '장기 복용'으로 뭉뚱그려짐 → 조건 누락 코딩 대상.

  - bundle_id: B02_APAP_autism_Ahlqvist2024
    label: "임신 중 아세트아미노펜 ↔ 자폐·ADHD (스웨덴 형제 비교, JAMA 2024)"
    drug_terms: [아세트아미노펜, 타이레놀, 파라세타몰, 해열진통제, 진통제]
    outcome_terms: [자폐, 자폐증, 자폐스펙트럼, ADHD, 주의력결핍, 지적장애]
    paper:
      doi: "10.1001/jama.2024.3172"
      title: "Acetaminophen Use During Pregnancy and Children's Risk of Autism, ADHD, and Intellectual Disability"
      journal: JAMA
      first_author: Ahlqvist
      published: "2024-04-09"
    search:
      queries: ["임신 타이레놀 자폐", "아세트아미노펜 임신 자폐 스웨덴", "타이레놀 자폐 형제", "임신 중 진통제 ADHD 자폐",
                "카롤린스카 아세트아미노펜 자폐", "드렉셀대 타이레놀 자폐", "임신 중 아세트아미노펜 지적장애",
                "타이레놀 자폐 248만", "타이레놀 자폐 248만명 추적", "타이레놀 자폐 대규모 데이터 결과"]
      date_from: "2024-04-09"
      # 2024년 보도는 1건뿐. 2026-02-17~18 에 이 논문을 '최근 발표'로 다시 소개한 기사들이 나왔다(22개월 뒤 재보도).
      # 그 사이 2025-09 트럼프 발언 기사들은 이 논문을 '배경'으로만 인용 → link_type 으로 구분
      date_to: "2026-02-28"
    known_articles:   # 2026-10-02 네이버 API(2024년 기간)로는 0건 → 웹 검색으로 찾은 2024년 보도
      - outlet: 메디칼업저버
        title_hint: "임신 중 아세트아미노펜 복용, 아동 자폐증 위험과 관련 없다"
        url: "https://www.monews.co.kr/news/articleView.html?idxno=331338"
      - outlet: KIMS
        title_hint: "임신 중 아세트아미노펜, 자폐증, ADHD와 관련성 없어"
        url: "https://www.kimsonline.co.kr/ResCenter/worldnews/view/3205"
      - outlet: 한국경제
        title_hint: "\"임신 중 타이레놀이 자폐 유발?\" 대규모 데이터 결과 나왔다"
        url: "https://www.hankyung.com/article/2026021785587"
    notes: >
      스웨덴 아동 2,480,797명. 형제자매 대조 시 연관성 소멸(ASD HR 0.98).
      2025-09 트럼프 발언 이후 기사들은 이 논문을 '배경'으로만 인용하는 경우가 많다
      → article_candidates.csv 의 link_type 을 main / background 로 꼭 구분할 것.

