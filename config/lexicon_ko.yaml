# =====================================================================
# 한국어 규칙 기반 사전 — '자동 사전 코딩(pre-coding)'용
#
# 이 사전으로 낸 값은 사람 코더에게 보여주는 '제안값'일 뿐이다. 최종 판정은
# docs/codebook.md 기준으로 사람이 한다. (사전 = 가설이므로, 사람 코딩과의 일치도를
# `medclaim agreement`가 따로 보고한다.)
#
# 항목 문법
#   일반 문자열      → 부분 문자열 일치 (대소문자 무시)
#   're:<정규식>'    → 정규식 일치. YAML 작은따옴표 안에서는 \ 를 그대로 쓰면 된다.
# =====================================================================

# --- 인과 표현 강도 (Sumner et al., 2014 BMJ의 7범주를 한국어로 옮김) -------------------
#   0 진술 없음 / 1 관계 없음 명시 / 2 상관(연관) / 3 모호 / 4 조건부 인과(might)
#   5 인과 가능(can) / 6 단정적 인과
claim_strength:
  # 인과 동사. 기본 6. 바로 뒤(window 글자)에 modal_after.may → 4, modal_after.can → 5,
  # negation_after → 1(관계 없음)로 조정한다.
  causal:
    - 유발
    - 're:일으(키|킨|켜|켰|킬)'
    - 초래
    - 야기
    - 're:원인(?!\s*불명)'
    - 때문
    - 're:(?<![가-힣])탓'
    - 're:높(이[는고며다지]|인다|인|여|였|일)'
    - 're:늘(리|린|려|렸|릴)'
    - 're:(증가|상승|악화|감소|손상|저하)시(키|킨|켜|켰|킬)'
    - 're:키(우|운|워|웠|울)'
    - 're:(?<![가-힣])부(른다|르는|른|를|른다고)'
    - 're:낮(추|춘|춰|췄|출)'
    - 're:줄(이|인|여|였|일)'
    - 're:예방(한다|해|하는|효과)'
    - 're:막(는다|아준|아|았)'
    - 're:높아(지|진|져|졌|질)'
    - 're:커(지|진|져|졌|질)'
    - 're:(증가|상승|감소)(한다|해|하는|할)'
    - 're:생(긴다|겨|기는|길)'
    - 're:걸(린다|린|릴)'
  # 조건부 인과(might/may). 문장 안에 약물·결과 언급이 있을 때만 센다.
  conditional:
    - 가능성
    - 우려
    - 의심
    - 're:수도\s*있'
    - 're:지도\s*모르'
  # 모호(ambiguous): 관계는 말하지만 방향·성격이 불분명. 명사형 헤드라인 '위험 상승', 'n배'.
  ambiguous:
    - 연결
    - 're:관계(가|를)?\s*(있|보|맺)'
    - 영향
    - 위험 신호
    - 적신호
    - 빨간불
    - 경고등
    - 're:(위험|발병률|발생률|위험도)\s*(증가|상승|↑)(?!\s*(시키|했|한다|해|하는))'
  # 약한 모호 단서: 다른 단서(2~6)가 하나도 없을 때만 3으로 센다.
  # 예) '실명위험'(명사 헤드라인), "'시력 손실' 부작용"(부작용이라 이름 붙이는 것 자체가 인과 함의),
  #     '일부 환자서 NAION 발생', '치매 위험 1.3배'
  ambiguous_weak:
    - 're:위험(?!\s*요인)'
    - 부작용
    - 발생
    - 're:\d+(\.\d+)?\s*배'
  # 상관(correlational): '연관/관련', 통계적 차이를 서술하는 과거형
  correlational:
    - 연관
    - 상관
    - 're:관련(성|이?\s*있|돼|된|됐)'
    - 경향
    - 're:(높|많|컸|크|낮|적)았'
    - 're:(높|많|낮|적)은\s*것으로'
    - 're:(증가|상승|감소|하락)했'
    - 관찰
    - 연계
  # 관계 없음을 명시
  no_relationship:
    - 're:(연관|관련|관계|상관)(성|이|은|는)?\s*(없|않)'
    - 're:인과\s*관계(는|가|에)?\s*(회의|불분명|없|아니|아냐)'
    - 무관
    - 상관없
    - 're:영향(이|을)?\s*(없|주지\s*않|미치지\s*않)'
    - 're:차이(가|는)?\s*없'
    - 're:유의(미)?하지\s*않'
    - 're:근거(가|는)?\s*없'
    - 괴담
    - 누명
    - 're:사실(이)?\s*(아니|아냐)'
    - 're:안전(하다|해|한\s*것으로)'

# 인과 동사 '바로 뒤' 창(window) 안에서 찾는 패턴 (문장부호에서 창을 자른다)
window: 8
negation_after: '(지\s*않|않[는았아고으다]|없[다어었는고음이]|없$|아니|아냐|아님|못\s*(하|했|한)|무관)'
modal_after:
  may: '(수도\s*있|가능성|우려|의심|지도\s*모)'
  can: '수\s*있'

# 문장이 '목표 관계(약물→결과)'에 대한 진술인지 거르는 데 쓰는 노출 표현
exposure:
  - 복용
  - 투약
  - 투여
  - 사용
  - 처방
  - 섭취
  - 're:(?<![가-힣])먹(으면|는|은|었|을)'
  - 주사
  - 노출

# 방향 (위험 증가 / 감소)
direction:
  increase:
    - 're:높(아|아진|아져|인|여|였|이|았|은)'
    - 're:늘(어|린|려|었)'
    - 증가
    - 상승
    - 're:커(지|진|져|졌)'
    - 're:키(우|운|워)'
    - 악화
    - 유발
    - 're:일으(키|킨|켜)'
    - 초래
    - 야기
    - 're:\d+(\.\d+)?\s*배'
  decrease:
    - 're:낮(아|아진|아져|춘|춰|았|은)'
    - 're:줄(어|인|여|었)'
    - 감소
    - 하락
    - 예방
    - 보호
    - 're:막(는|아)'

# --- 적용 조건(연구 대상·용량·기간·설계 등) 언급 탐지 ------------------------------------
# 묶음별로 '이 논문을 정확히 전달하려면 꼭 필요한 조건'을 사람이 paper_coding.csv 의
# key_conditions 에 적고, 기사 제목/리드/본문에 그 범주가 남아 있는지를 센다.
conditions:
  population:
    - 're:\d+\s*세\s*(이상|이하|미만|초과|부터|~)?'
    - 're:\d+\s*[~\-]\s*\d+\s*세'
    - 성인
    - 노인
    - 고령
    - 중장년
    - 어린이
    - 아동
    - 소아
    - 청소년
    - 영유아
    - 're:임(신|산)부'
    - 산모
    - 임신 중
    - 're:(?<![가-힣])(남|여)성'
    - 환자
    - 당뇨
    - 비만
    - 과체중
    - 참가자
    - 대상자
  animal:
    - 생쥐
    - 're:(?<![가-힣])쥐(?!어|고|며)'
    - 마우스
    - 동물
    - 실험용
    - 세포
    - 원숭이
    - 영장류
    - 초파리
  sample_size:
    - 're:\d[\d,\.]*\s*(만\s*)?(천\s*)?\s*명'
    - 're:\d[\d,]*\s*쌍'
    - 're:\d[\d,\.]*\s*만\s*건'
  dose:
    - 're:\d+(\.\d+)?\s*(mg|㎎|밀리그램|μg|mcg|IU)'
    - 용량
    - 복용량
    - 투여량
  duration:
    - 're:(?<![\d.])\d{1,2}(\.\d+)?\s*년\s*(이상|이하|간|동안|넘|초과|미만|가량|여|째)'
    - 're:(?<![\d.])\d{1,3}\s*개월'
    - 're:(?<![\d.])\d{1,3}\s*주\s*(이상|간|동안|째)'
    - 장기
    - 단기
    - 누적
    - 추적
    - 're:오랫?동안'
  design:
    - 코호트
    - 're:관찰\s*연구'
    - 후향
    - 전향
    - 무작위
    - 임상시험
    - 메타분석
    - 체계적 문헌
    - 're:형제(자매)?\s*(비교|대조|분석|매칭)'
    - 're:(증례|사례)\s*(보고|연구)'
    - 're:단일\s*기관'
    - 데이터베이스
    - 빅데이터
    - 건강보험
    - 전자의무기록
    - 설문
    - 매칭
  effect_size:
    - 're:(?<![A-Za-z])(HR|OR|RR|aHR|aOR)(?![A-Za-z])'
    - 위험비
    - 오즈비
    - 상대위험
    - 신뢰구간
    - 're:\d+(\.\d+)?\s*배'
    - 're:\d+(\.\d+)?\s*%'
  limitation:
    # '인과관계가 없다'(무관 결과 자체)는 주의 문장이 아니다 → 입증·확정·설명 '못한다'류만
    - 're:인과\s*관계[는를가이도은]?\s*.{0,8}(입증|증명|확정|규명|설명|단정|의미|확인|밝히|말해주)[^.]{0,10}(않|없|못|어렵|아니)'
    - 're:인과\s*관계[는를가이도은]?\s*.{0,15}연구가?\s*필요'
    - 're:인과\s*관계[^.]{0,6}(불분명|불확실|밝혀지지|확실하지)'
    - 're:(추가|후속|더 많은)(적인|적)?\s*(연구|조사|검증)'
    - 한계
    - 're:단정(할 수 없|하기 어렵|짓기 어렵|할 순 없|해서는)'
    - 're:해석에?\s*(주의|신중)'
    - 're:(해석|받아들여)(해서는|하면)\s*안'
    - 확대 해석
    - 're:일반화(하기|할 수)'
    - 're:(그대로|즉각|바로)\s*적용(할|하기)?\s*(수(는|가)?\s*없|어렵|에는)'
    - 're:적용(하기)?(에는|은|는)?\s*(무리|어렵)'
    - 're:(임의로|함부로|섣불리)\s*(중단|끊)'
    - 're:(의미|뜻)(는|이)?\s*아니'
    - 're:(의미|뜻)하(지|는 것은)\s*(는\s*)?않'
    # '교란 요인을 통제했다'(방법 설명)·'내분비 교란물질'은 제외
    - 're:교란\s*(요인|변수)(?![^.]{0,20}(통제|조정|보정|배제))'
    - 're:연관성(만|일 뿐)'
    - 're:(시사|보여줄)할?\s*뿐'

# --- 불확실성(hedge) / 확실성 강화(booster) / 선정성 / 행동 권고 ---------------------------
hedges:
  - 가능성
  - 're:수\s*있'
  - 're:수도'
  - 're:것으로\s*(보인|보여|추정|추측)'
  - 추정
  - 아직
  - 're:(확인|밝혀|입증|규명)되지\s*않'
  - 're:명확(하지|치)\s*않'
  - 불분명
  - 불확실
  - 논란
  - 여지
  - 're:단정(할 수 없|하기 어렵)'
  - 're:(추가|후속)\s*연구'
  - 회의적

boosters:
  - 're:확인(됐|되었|돼)'
  - 입증
  - 're:밝혀(졌|냈)'
  - 드러났
  - 증명
  - 확실
  - 반드시
  - 무조건
  - 명백
  - 결정적
  - 분명
  - '100%'

sensational:
  - 충격
  - 경악
  - 공포
  - 괴담
  - 비상
  - 경고
  - 날벼락
  - 눈물
  - 자칫
  - 치명
  - 끔찍
  - 소름
  - 're:알고\s*(보니|봤더니)'
  - 위험천만
  - 're:죽음의'
  - '!'

# 행동 권고 (Sumner 4범주): 3 독자에게 명시적 권고 / 2 의료진 대상 명시적 권고 / 1 암묵적 권고
advice:
  3:
    - 're:(복용|투약|사용)을?\s*(중단|끊|피|삼가|자제)(해야|하세요|하라|하는\s*게|할\s*것)'
    - 're:(피해야|삼가야|자제해야|조심해야)'
    - 're:(드시지|먹지|복용하지|사용하지)\s*(마|말아야|않는\s*게)'
    - 're:상담(하세요|해야|을\s*받아야|할\s*것을)'
    - 're:(임의로|함부로)\s*(중단|끊)(해서는|으면|지\s*말)'
  2:
    - 're:(의사|의료진|처방의|임상의|약사)[은는이가들]?\s.{0,30}(해야|필요|권고|고려)'
    - 're:처방\s*시\s*(주의|고려|신중)'
  1:
    - 're:주의(가|를)?\s*(필요|요구|당부)'
    - 주의보
    - 신중
    - 're:(고려|모니터링|관찰|검토|확인)(할|이|가)?\s*필요'
    - 're:(고려|검토|평가|관리|확인)해야'
    - 're:(이뤄져|이루어져|제공해)야'
    - 경각심

# 출처 표기 (연구팀·학술지 언급)
attribution:
  - 학술지
  - 저널
  - 게재
  - 논문
  - 연구팀
  - 연구진
  - 교수
  - 're:(?<![가-힣])박사'

# --- 댓글 반응 사전 (RQ3) -------------------------------------------------------------------
# 소규모 수제 사전이다. 반어·비꼼·밈은 못 잡는다(LIMITATIONS.md 참고).
comment_reactions:
  anxiety:
    - 무섭
    - 무서
    - 걱정
    - 불안
    - 겁나
    - 겁이
    - 어떡
    - 어쩌
    - 큰일
    - 소름
    - 두렵
    - 두려
    - 're:먹어도\s*(되|돼|괜찮)'
    - 're:끊어야'
    - 끊었
    - 끊을
  distrust:
    - 기레기
    - 're:믿을\s*(수|게)\s*(가|없)'
    - 're:못\s*믿'
    - 광고
    - 제약사
    - 제약회사
    - 로비
    - 거짓
    - 선동
    - 음모
    - 가짜
    - 조작
    - 주작
    - 언플
    - 돈벌이
    - 're:누구\s*말을'
  reassurance:
    - 다행
    - 안심
    - 괜찮
    - 're:문제\s*없'
    - 상관없
    - 안전

# 토큰화 시 빼는 말 (분석 목적에 맞게 팀에서 조정)
stopwords: [기자, 뉴스, 무단, 전재, 배포, 금지, 저작권, 사진, 제공, 연합뉴스, 뉴시스, 뉴스1, 이날, 지난, 이번, 오늘, 하다, 되다, 이다]
# '있다'·'않다'·'없다'·'수'는 일부러 남긴다: 명사만 남기면 부정·불확실성 정보가 사라진다.
