# `medclaim discover` 설정 — 새 묶음 후보(논문) 찾기
#
# 원칙은 '논문 → 기사' 방향이지만, 기사가 3건 이상 붙는 논문을 고르려면
# 먼저 "어떤 약물-부작용 연구가 한국어로 여러 번 보도됐는가"를 훑어보는 게 효율적이다.
# discover 는 네이버 뉴스 검색 결과에서 (약물, 결과, 언급된 저널) 조합별 기사 수를 센다.
# 결과(annotation/bundle_candidates.csv)를 보고 사람이 원논문을 확인한 뒤 bundles.yaml 에 추가한다.

drugs:
  아세트아미노펜: [타이레놀, 아세트아미노펜, 파라세타몰]
  세마글루타이드: [위고비, 오젬픽, 세마글루타이드]
  티르제파타이드: [마운자로, 티르제파타이드, 젭바운드]
  GLP-1: [GLP-1, 비만치료제, 비만약]
  PPI: [PPI, 위산분비억제제, 양성자펌프억제제]
  피나스테리드: [피나스테리드, 탈모약, 프로페시아]
  스타틴: [스타틴, 고지혈증약, 콜레스테롤약]
  메트포르민: [메트포르민, 당뇨약]
  아스피린: [아스피린]
  졸피뎀: [졸피뎀, 수면제]
  항우울제: [항우울제, SSRI]
  ADHD약: [메틸페니데이트, ADHD 치료제, 콘서타]
  벤조디아제핀: [벤조디아제핀, 신경안정제]
  항생제: [항생제, 플루오로퀴놀론]
  경구피임약: [경구피임약, 피임약]
  이부프로펜: [이부프로펜, 소염진통제, NSAID]
  항히스타민제: [항히스타민제, 알레르기약]
  스테로이드: [스테로이드]
  멜라토닌: [멜라토닌]

outcomes: [치매, 알츠하이머, 암, 자살, 우울, 자폐, ADHD, 실명, 시력, 심근경색, 심장, 뇌졸중,
           사망, 골절, 탈모, 성기능, 췌장염, 신장, 간, 출혈, 당뇨, 기형, 유산, 조산, 인지]

# {drug} 자리에 drugs 의 각 표현이 들어간다
query_templates:
  - "{drug} 부작용 연구"
  - "{drug} 위험 연구팀"
  - "{drug} 학술지 게재"

max_per_query: 100
